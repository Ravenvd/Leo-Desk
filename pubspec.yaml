name: leo_desk
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.0+11

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package might depend on.
# To automatically upgrade packages to the latest versions, consider running
# `flutter pub upgrade --major-versions`. Alternatively, dependencies can be
# manually updated by changing the version numbers below.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  path: ^1.9.1
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  uuid: ^4.5.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - assets/images/leo_logo.png

  uses-material-design: true

# Leo Desk 2.0 branding
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/leo_logo.png
  adaptive_icon_background: "#F7F3EC"
  adaptive_icon_foreground: assets/images/leo_logo.png
  windows:
    generate: true
    image_path: assets/images/leo_logo.png
